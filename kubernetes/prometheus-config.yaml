apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: bendcore-production
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'bendcore-prod'
        environment: 'production'

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'bendcore-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - bendcore-production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: bendcore
          - source_labels: [__meta_kubernetes_pod_label_tier]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '9090'

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - bendcore-production
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)

  alert-rules.yml: |
    groups:
      - name: bendcore_application
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              rate(http_requests_total{status=~"5..", job="bendcore-backend"}[5m]) > 0.05
            for: 5m
            labels:
              severity: critical
              team: platform
            annotations:
              summary: "High error rate on BendCore backend"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.instance }}"
              runbook_url: "https://wiki.bendcore.app/runbooks/high-error-rate"

          - alert: HighLatency
            expr: |
              histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="bendcore-backend"}[5m])) > 1
            for: 5m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "High API latency detected"
              description: "P99 latency is {{ $value }}s for {{ $labels.instance }}"

          - alert: HighMemoryUsage
            expr: |
              (container_memory_usage_bytes{pod=~"bendcore-backend.*"} / container_spec_memory_limit_bytes) > 0.9
            for: 5m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "High memory usage in pod {{ $labels.pod }}"
              description: "Memory usage is {{ $value | humanizePercentage }}"

          - alert: HighCPUUsage
            expr: |
              rate(container_cpu_usage_seconds_total{pod=~"bendcore-backend.*"}[5m]) > 0.8
            for: 5m
            labels:
              severity: warning
              team: infrastructure
            annotations:
              summary: "High CPU usage in pod {{ $labels.pod }}"
              description: "CPU usage is {{ $value | humanizePercentage }}"

          - alert: PodCrashLooping
            expr: |
              rate(kube_pod_container_status_restarts_total{namespace="bendcore-production"}[15m]) > 0.1
            for: 5m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod has restarted {{ $value }} times in the last 15 minutes"

      - name: bendcore_infrastructure
        interval: 30s
        rules:
          - alert: PersistentVolumeUsage
            expr: |
              (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.9
            for: 10m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Persistent volume {{ $labels.persistentvolumeclaim }} is 90% full"
              description: "Used: {{ humanize $value }}%"

          - alert: NodeMemoryPressure
            expr: |
              kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
            for: 5m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Node {{ $labels.node }} has memory pressure"

          - alert: NodeDiskPressure
            expr: |
              kube_node_status_condition{condition="DiskPressure",status="true"} == 1
            for: 5m
            labels:
              severity: critical
              team: infrastructure
            annotations:
              summary: "Node {{ $labels.node }} has disk pressure"

      - name: bendcore_slo
        interval: 60s
        rules:
          - alert: SLOViolation
            expr: |
              (rate(http_requests_total{status=~"2..", job="bendcore-backend"}[30m]) / rate(http_requests_total{job="bendcore-backend"}[30m])) < 0.99
            for: 10m
            labels:
              severity: warning
              team: platform
            annotations:
              summary: "BendCore SLO violation (99% availability)"
              description: "Availability is {{ $value | humanizePercentage }}"
