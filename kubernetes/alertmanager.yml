global:
  resolve_timeout: 5m
  slack_api_url: ${SLACK_WEBHOOK_URL}

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      group_interval: 30s
      repeat_interval: 4h

    - match:
        team: platform
      receiver: 'platform-team'
      group_wait: 10s
      group_interval: 10s

    - match:
        team: infrastructure
      receiver: 'infrastructure-team'
      group_wait: 10s
      group_interval: 10s

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: 'BendCore Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  - name: 'critical'
    slack_configs:
      - channel: '#critical-alerts'
        title: 'CRITICAL: BendCore'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true
        color: 'danger'
    pagerduty_configs:
      - service_key: ${PAGERDUTY_SERVICE_KEY}
        description: '{{ .GroupLabels.alertname }}: {{ .Alerts.Firing | len }} firing'

  - name: 'warning'
    slack_configs:
      - channel: '#warnings'
        title: 'Warning: BendCore'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}'
        send_resolved: true
        color: 'warning'

  - name: 'platform-team'
    slack_configs:
      - channel: '#platform-notifications'
        title: 'Platform Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

  - name: 'infrastructure-team'
    slack_configs:
      - channel: '#infrastructure-notifications'
        title: 'Infrastructure Alert'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  - source_match:
      alertname: 'PodCrashLooping'
    target_match:
      alertname: 'ContainerHighCPU'
    equal: ['pod', 'namespace']

  - source_match:
      alertname: 'NodeMemoryPressure'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['node']
