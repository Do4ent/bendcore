  memory_leaks_allowed: 0

# ============================================================================
# Quality Standards (Karpathy Guidelines)
# ============================================================================
quality:
  - All code must follow Karpathy AI Coding Guidelines
  - Zero compiler warnings (clang++ -Wall -Wextra -Werror)
  - 100% unit test pass rate
  - Zero memory leaks (valgrind verification)
  - Complete TypeScript typing (no any types)
  - All functions documented with JSDoc/comments
  - Performance benchmarks for critical paths

# ============================================================================
# GitHub Integration
# ============================================================================
github:
  repository: "https://github.com/Do4ent/bendcore"
  branch: "main"
  commit_frequency: "per-phase"
  commit_template: |
    feat(M{phase}): {description}

    - {GAP_description}
    - {components_count} components
    - {test_count} tests, 100% pass rate
    - Zero warnings, zero memory leaks

    Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>
    Claude-Session: https://claude.ai/code/session_01Wnwv1uAckpd6ZA3sCt3kki

