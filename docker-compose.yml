version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bendcore-backend
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOG_LEVEL=debug
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
    networks:
      - bendcore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend web service
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bendcore-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ui/src:/app/src:ro
    networks:
      - bendcore-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL database (optional)
  postgres:
    image: postgres:15-alpine
    container_name: bendcore-postgres
    environment:
      - POSTGRES_USER=bendcore
      - POSTGRES_PASSWORD=bendcore_dev_password
      - POSTGRES_DB=bendcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bendcore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bendcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache (optional)
  redis:
    image: redis:7-alpine
    container_name: bendcore-redis
    volumes:
      - redis_data:/data
    networks:
      - bendcore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bendcore-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
