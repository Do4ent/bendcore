version: '3.8'

services:
  # C++ Analysis Server
  bendcore-server:
    image: bendcore:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    command: ./bendcore_server 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - bendcore-net

  # Node.js Backend Proxy
  bendcore-backend:
    image: bendcore:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BENDCORE_SERVER_PORT=8080
      - BENDCORE_SERVER_HOST=bendcore-server
    command: bash -c "cd backend && node dist/index.js"
    depends_on:
      bendcore-server:
        condition: service_healthy
    networks:
      - bendcore-net

networks:
  bendcore-net:
    driver: bridge

# Quick start:
# docker-compose up --build
# Open http://localhost:3001 (backend) or configure frontend separately
