<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bendcore — проверка WASM</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .ok { color: #137333; font-weight: 600; }
    .fail { color: #b3261e; font-weight: 600; }
  </style>
</head>
<body>
  <h1>bendcore: проверка WebAssembly-сборки</h1>
  <p>Квадрат 10×10 на 2D-эскизе (7.9). Ожидается статус «определено», степени свободы 0.</p>
  <div id="result">Загрузка модуля…</div>
  <pre id="log"></pre>

  <script type="module">
    import { loadBendcore, Sketch2D, importTube, axisLength, tracePath } from './bendcore.mjs';

    const out = document.getElementById('result');
    const log = document.getElementById('log');
    const say = (msg) => { log.textContent += msg + '\n'; };

    try {
      const core = await loadBendcore();
      say('tangentLength(50, 90) = ' + core.tangentLength(50, 90).toFixed(6) + ' (ожидается 50.000000)');
      say('wrap180(190) = ' + core.wrap180(190).toFixed(6) + ' (ожидается -170.000000)');

      // Импорт: CSV с прямой и портом; ошибочная строка должна дать исключение.
      const header = ['kind','length','radius','angle','rotation','pitch','turns','direction','x','y','z','dx','dy','dz','od','name'];
      const row = (cells) => header.map((h) => cells[h] ?? '').join(',');
      const csv = [header.join(','), row({kind:'straight', length:50}), row({kind:'port', x:0, y:0, z:0, dx:-1, dy:0, dz:0, od:20, name:'A'})].join('\n');
      const tube = importTube(core, 'csv', csv, { od: 20 });
      say('импорт CSV: участков ' + tube.path.length + ', портов ' + tube.ports.length + ' (ожидается 1 и 1)');
      let importError = false;
      try { importTube(core, 'csv', 'kind,length\nwave,1\n', { od: 20 }); } catch (e) { importError = true; }
      say('импорт с ошибкой: исключение ' + (importError ? 'есть' : 'нет') + ' (ожидается есть)');
      const lenOk = Math.abs(axisLength(core, tube.path) - 50) < 1e-9;
      const pts = tracePath(core, tube.path);
      const traceOk = pts.length >= 2 && Math.abs(pts[pts.length - 1].x - 50) < 1e-9;
      say('длина оси ' + axisLength(core, tube.path) + ' (ожидается 50); конец трассы x = ' + pts[pts.length - 1].x);
      const importOk = tube.path.length === 1 && tube.path[0].kind === 'straight' && tube.path[0].length === 50
        && tube.ports.length === 1 && tube.ports[0].name === 'A' && importError && lenOk && traceOk;

      const s = new Sketch2D(core);
      const p0 = s.addPoint(0, 0);
      const p1 = s.addPoint(10.5, 0.4);
      const p2 = s.addPoint(10.2, 9.8);
      const p3 = s.addPoint(0.3, 10.1);
      s.fixPoint(p0);
      s.constrainHorizontal(p0, p1);
      s.constrainVertical(p1, p2);
      s.constrainHorizontal(p3, p2);
      s.constrainVertical(p0, p3);
      s.constrainDistance(p0, p1, 10);
      s.constrainDistance(p1, p2, 10);

      const r = s.solve();
      const ok = r.status === 'определено' && r.dof === 0 && Math.abs(core.wrap180(190) + 170) < 1e-9 && importOk;
      out.innerHTML = ok
        ? '<span class="ok">Тест пройден</span>'
        : '<span class="fail">Тест не пройден</span>';
      say('status = ' + r.status + ', dof = ' + r.dof);
      say('p2 = ' + JSON.stringify(s.point(p2)));
      s.dispose();
    } catch (err) {
      out.innerHTML = '<span class="fail">Ошибка загрузки или вычисления</span>';
      say(String(err && err.stack ? err.stack : err));
    }
  </script>
</body>
</html>
