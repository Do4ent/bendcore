version: '3.8'

services:
  # Backend API service - production optimized
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bendcore-backend-prod
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=error
    expose:
      - "3001"
    volumes:
      - ./logs/backend:/app/logs
    networks:
      - bendcore-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend web service - production optimized
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bendcore-frontend-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - bendcore-network
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL database - production
  postgres:
    image: postgres:15-alpine
    container_name: bendcore-postgres-prod
    environment:
      - POSTGRES_USER=bendcore
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=bendcore
      - POSTGRES_INITDB_ARGS=-c max_connections=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - bendcore-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bendcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache - production
  redis:
    image: redis:7-alpine
    container_name: bendcore-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - bendcore-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bendcore-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
