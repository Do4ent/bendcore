execution_strategy:
  parallel_groups:
    - phase: "M12"
      max_parallel: 4
      start_after: 0
    - phase: "M13"
      max_parallel: 5
      start_after: 180  # Start M12, let it run for 3 hours
    - phase: "M14"
      max_parallel: 6
      start_after: 240  # Start M13, let it run for 4 hours
    - phase: "M15"
      max_parallel: 5
      start_after: 300  # Continue overlapping
    - phase: "M16"
      max_parallel: 4
      start_after: 360
    - phase: "M17"
      max_parallel: 5
      start_after: 420
    - phase: "M18"
      max_parallel: 4
      start_after: 480
    - phase: "M19"
      max_parallel: 5
      start_after: 540
    - phase: "M20"
      max_parallel: 6
      start_after: 600

github:
  repository: "https://github.com/Do4ent/bendcore"
  branch: "develop"
  commit_template: |
    feat(M{phase}-A{agent}): Implement {task_name} (GAP-{id})

    - {description}
    - {test_count} unit tests (100% pass rate)
    - All error cases covered
    - Memory safety verified
    - Performance benchmarks included
    - Karpathy guidelines compliant

    Co-Authored-By: Claude Haiku 4.5 <noreply@anthropic.com>
    Claude-Session: https://claude.ai/code/session_01Wnwv1uAckpd6ZA3sCt3kki

quality_requirements:
  - minimum_tests: 30
  - test_pass_rate: 100
  - compiler_warnings: 0
  - code_coverage: 95
  - memory_safety: true
  - performance_benchmarks: true
  - karpathy_guidelines: true
  - error_cases_covered: true
  - documentation_inline: true
