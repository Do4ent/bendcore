name: Frontend dependency verification

on:
  push:
    branches:
      - fix/frontend-missing-dependencies
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify package.json and package-lock.json agree
        run: npm ls --all --omit=optional > /dev/null
      - name: TypeScript
        if: always()
        run: npx tsc --noEmit > typescript-errors.log 2>&1 || { cat typescript-errors.log; exit 1; }
      - name: Jest
        if: always()
        run: npx jest --runInBand --ci > jest-errors.log 2>&1 || { cat jest-errors.log; exit 1; }
      - name: Build
        if: always()
        run: npm run build > build-errors.log 2>&1 || { cat build-errors.log; exit 1; }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: |
            *-errors.log
          if-no-files-found: warn
