name: Deploy Backend to Railway

# Деплой выполняется, только если заданы секреты RAILWAY_TOKEN и RAILWAY_PROJECT_ID.
# Без них задача deploy пропускается (не «падает»): деплой не настроен.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Railway::Секреты RAILWAY_TOKEN / RAILWAY_PROJECT_ID не заданы — деплой пропущен"
          fi

  deploy:
    needs: config
    if: needs.config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: cd backend && npm install --no-audit --no-fund

      - name: Build backend
        run: cd backend && npm run build

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          npx --yes @railway/cli up --service bendcore-backend --environment production \
            --project "$RAILWAY_PROJECT_ID" --detach
