name: Build & Test

# JavaScript/TypeScript: backend (Express, backend/) и интерфейс (React/Electron, корень репозитория, src/ui).
# Ядро C++ (нативно с OCCT и WebAssembly) проверяется в wasm.yml.
# Интерфейс ставится через npm ci по зафиксированному package-lock.json (с кэшем npm).
# У backend lock-файла нет, поэтому там npm install без кэша setup-node.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 18.x, 20.x ]
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee ../ci-backend.log

      - name: Build
        run: set -o pipefail; npm run build 2>&1 | tee -a ../ci-backend.log

      - name: Test
        run: set -o pipefail; npm test -- --ci 2>&1 | tee -a ../ci-backend.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        working-directory: .
        run: |
          grep -n -E "error|Error|FAIL|✕" ci-backend.log | grep -v -i "warn" | head -n 25 \
            | while IFS= read -r line; do echo "::error title=backend::${line:0:900}"; done || true
          tail -n 20 ci-backend.log | while IFS= read -r line; do echo "::error title=backend-tail::${line:0:900}"; done || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: set -o pipefail; npm ci --no-audit --no-fund 2>&1 | tee ci-frontend.log

      - name: TypeScript strict mode check
        run: set -o pipefail; npm run typecheck 2>&1 | tee -a ci-frontend.log

      - name: Build (tsc + webpack)
        run: set -o pipefail; npm run build 2>&1 | tee -a ci-frontend.log

      - name: Unit tests
        run: set -o pipefail; npm test -- --ci --runInBand 2>&1 | tee -a ci-frontend.log

      - name: Verify dist/ output
        run: |
          [[ -d dist/web ]] && [[ -f dist/web/index.html ]] && echo "✓ Build output verified" || { echo "✗ Build output missing"; exit 1; }

      - name: Report errors (on failure)
        if: failure()
        run: |
          echo "=== TypeScript Errors ===" >&2
          grep -n "error TS" ci-frontend.log | head -n 20 || true
          echo "=== Build Errors ===" >&2
          grep -n "ERROR\|Error:" ci-frontend.log | head -n 20 || true
          echo "=== Test Failures ===" >&2
          grep -n "FAIL\|✕" ci-frontend.log | head -n 20 || true
          echo "=== Last 30 lines ===" >&2
          tail -n 30 ci-frontend.log || true
          exit 1
