name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 18.x, 20.x ]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Backend
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint
        continue-on-error: true

      - name: Build backend
        run: cd backend && npm run build

      - name: Test backend
        run: cd backend && npm test

      - name: Backend coverage
        run: cd backend && npm run test:coverage

      - name: Upload backend coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          continue-on-error: true

      # Frontend
      - name: Install frontend dependencies
        run: cd ui && npm ci

      - name: Lint frontend
        run: cd ui && npm run lint
        continue-on-error: true

      - name: Build frontend
        run: cd ui && npm run build

      - name: Test frontend
        run: cd ui && npm test
        continue-on-error: true

      # Docker build verification
      - name: Build Docker backend image
        run: docker build -f docker/Dockerfile.backend -t bendcore-backend:test .

      - name: Build Docker frontend image
        run: docker build -f docker/Dockerfile.frontend -t bendcore-frontend:test .

      # Security scanning
      - name: Scan Docker image - backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bendcore-backend:test'
          format: 'sarif'
          output: 'trivy-backend.sarif'
        continue-on-error: true

      - name: Scan Docker image - frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bendcore-frontend:test'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-*.sarif'
        continue-on-error: true

      # PR comment with results
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const backend_coverage = 'backend/coverage/lcov.info';
            const coverage_exists = fs.existsSync(backend_coverage);

            let comment = '## Build & Test Results\n\n';
            comment += '✅ Backend: Build & Test Passed\n';
            comment += '✅ Frontend: Build Passed\n';
            comment += '✅ Docker Images: Built Successfully\n';

            if (coverage_exists) {
              comment += '\n📊 Coverage reports generated (see Actions)\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
