name: Build & Test

# JavaScript/TypeScript: backend (Express, backend/) и интерфейс (React/Electron, корень репозитория, src/ui).
# Ядро C++ (нативно с OCCT и WebAssembly) проверяется в wasm.yml.
# lock-файлов в репозитории нет, поэтому npm install (не npm ci) и без кэша setup-node.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 18.x, 20.x ]
    defaults:
      run:
        working-directory: backend
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee ../ci-backend.log

      - name: Build
        run: set -o pipefail; npm run build 2>&1 | tee -a ../ci-backend.log

      - name: Test
        run: set -o pipefail; npm test -- --ci 2>&1 | tee -a ../ci-backend.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        working-directory: .
        run: |
          grep -n -E "error|Error|FAIL|✕" ci-backend.log | grep -v -i "warn" | head -n 25 \
            | while IFS= read -r line; do echo "::error title=backend::${line:0:900}"; done || true
          tail -n 20 ci-backend.log | while IFS= read -r line; do echo "::error title=backend-tail::${line:0:900}"; done || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install
        run: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee ci-frontend.log

      - name: Build (tsc + webpack)
        run: set -o pipefail; npm run build 2>&1 | tee -a ci-frontend.log

      - name: Test
        run: set -o pipefail; npm test -- --ci --passWithNoTests 2>&1 | tee -a ci-frontend.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        run: |
          grep -n -E "error TS|ERROR|Error:|FAIL|✕" ci-frontend.log | head -n 30 \
            | while IFS= read -r line; do echo "::error title=frontend::${line:0:900}"; done || true
          tail -n 20 ci-frontend.log | while IFS= read -r line; do echo "::error title=frontend-tail::${line:0:900}"; done || true
