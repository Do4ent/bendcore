name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Вызов из production-deploy.yml: сквозные тесты интерфейса — условие развёртывания.
  workflow_call:

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja, Eigen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Версия совпадает с emsdk из архива, см. emscripten-version.txt. Проверить при первом запуске.
          version: '6.0.12'
          actions-cache-folder: emsdk-cache

      - name: Сборка и тесты WASM
        shell: bash
        env:
          BENDCORE_EIGEN_DIR: /usr/include/eigen3
        # Полный лог сохраняется в файл (для диагностики при падении), код возврата — от скрипта.
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh 2>&1 | tee build-wasm.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          # Блоб-хранилище логов может быть недоступно; строки ошибок выводим аннотациями (читаются через API).
          grep -n -i -E "error|fatal|failed|undefined reference|not found" build-wasm.log 2>/dev/null \
            | grep -v -i "warning" | head -n 15 \
            | while IFS= read -r line; do echo "::error title=build-wasm::${line:0:900}"; done
          for f in playwright-install.log page-check.log; do
            [ -f "$f" ] && tail -n 15 "$f" | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done
          echo "--- хвост лога ---"
          tail -n 30 build-wasm.log 2>/dev/null | while IFS= read -r line; do echo "::error title=tail::${line:0:900}"; done || true

      - name: Логи сборки (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm-logs
          path: |
            build-wasm.log
            build-wasm/CMakeFiles/CMakeOutput.log
            build-wasm/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Установка Playwright и Chromium
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/wasm-check && cd /tmp/wasm-check && npm init -y >/dev/null
          { npm install --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium; } 2>&1 | tee "$GITHUB_WORKSPACE/playwright-install.log"

      - name: Проверка страницы web/index.html в браузере
        shell: bash
        run: |
          set -o pipefail
          cp scripts/check_wasm_page.mjs /tmp/wasm-check/
          node /tmp/wasm-check/check_wasm_page.mjs "$GITHUB_WORKSPACE/build-wasm/web" 2>&1 | tee page-check.log

      - name: Выходные файлы
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm
          path: build-wasm/web/
          if-no-files-found: error

  # Все WASM-модули (docs/ui/*.md): OCCT 8.0.1 для WASM (third_party/build_occt_wasm.sh,
  # docs/kernel/OCCT_BUILD.md, раздел 3) из кэша, одна сборка bendcore с emsdk и четыре цели —
  # bendcore_kernel_wasm, bendcore_modeling_wasm, bendcore_assembly_wasm, bendcore_drawing_wasm
  # (общие библиотеки ядра компилируются один раз), node-тесты всех модулей (ctest -R '^wasm_'),
  # размеры в сводку. Native-сборка с OCCT — job occt-native в qa.yml.
  wasm-modules:
    name: WASM-модули (OCCT 8.0.1; ядро, деталь, сборка, чертёж; node-тесты)
    runs-on: ubuntu-24.04
    # Сборка OCCT для WASM без кэша — около 25 минут на 4 ядрах (OCCT_BUILD.md, раздел 4),
    # четыре модуля — ещё около 30 минут.
    timeout-minutes: 150
    env:
      OCCT_VERSION: 8.0.1
      EMSDK_VERSION: 6.0.12
      # Проверки OCCT в Release (docs/kernel/OCCT_BUILD.md, раздел 6); входит в ключ кэша.
      OCCT_RELEASE_CHECKS: "1"
    steps:
      - uses: actions/checkout@v4

      # fonts-dejavu-core: DejaVuSans.ttf и текст лицензии, которые cmake/wasm_drawing.cmake кладёт
      # рядом с модулем чертежа (без шрифта чертёж не создаётся). Eigen — для PlaneGCS эскиза.
      - name: Зависимости (Ninja, Eigen, шрифт DejaVu)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev fonts-dejavu-core

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-modules

      # Ключ: версии OCCT и emsdk, список тулкитов и скрипт сборки. Кэшируются установка и
      # результаты пробной программы (sizes.txt, вывод под node), объектные файлы — нет.
      - name: Кэш OCCT для WASM
        id: occt-wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/occt-install-wasm-checked
            third_party/occt-build-wasm/probe
          key: occt-wasm-checks${{ env.OCCT_RELEASE_CHECKS }}-V${{ env.OCCT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('third_party/occt_toolkits.txt', 'third_party/build_occt_wasm.sh') }}

      # Тот же источник, что в build_occt.sh. Успех скрипта — код 0: внутри он собирает пробную
      # программу tests/kernel/wasm/occt_size_probe.cpp и проверяет её вывод OK под node.
      - name: Сборка OCCT для WASM (при промахе кэша)
        if: steps.occt-wasm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch "V${OCCT_VERSION}" https://github.com/Open-Cascade-SAS/OCCT.git \
            "third_party/occt-${OCCT_VERSION}"
          OCCT_SOURCE="$GITHUB_WORKSPACE/third_party/occt-${OCCT_VERSION}" \
          OCCT_WASM_INSTALL="$GITHUB_WORKSPACE/third_party/occt-install-wasm-checked" \
            third_party/build_occt_wasm.sh 2>&1 | tee occt-wasm-build.log

      - name: Конфигурация bendcore (Emscripten, BENDCORE_WITH_OCCT=ON)
        run: |
          emcmake cmake -S . -B build-wasm-modules -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBENDCORE_WITH_OCCT=ON -DBENDCORE_OCCT_DIR="$GITHUB_WORKSPACE/third_party/occt-install-wasm-checked" \
            -DBENDCORE_EIGEN_DIR=/usr/include/eigen3

      - name: Сборка четырёх модулей
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-wasm-modules --parallel \
            --target bendcore_kernel_wasm bendcore_modeling_wasm bendcore_assembly_wasm bendcore_drawing_wasm \
            2>&1 | tee build-wasm-modules.log

      - name: Шрифт модуля чертежа на месте
        run: test -s build-wasm-modules/wasm_drawing/DejaVuSans.ttf && test -s build-wasm-modules/wasm_drawing/DejaVuSans-LICENSE.txt

      # wasm_kernel_corpus, wasm_modeling_document, wasm_sketch_editor, wasm_assembly_document,
      # wasm_drawing_document; --no-tests=error — тест, пропавший из сборки, роняет шаг.
      - name: Node-тесты модулей (ctest -R wasm)
        run: ctest --test-dir build-wasm-modules -R '^wasm_' --no-tests=error --output-on-failure --timeout 900

      - name: Число node-тестов
        shell: bash
        run: |
          n=$(ctest --test-dir build-wasm-modules -N -R '^wasm_' | grep -c 'Test *#')
          echo "node-тестов WASM: $n"
          [ "$n" -ge 5 ]

      - name: Размеры модулей
        shell: bash
        run: |
          set -euo pipefail
          b=build-wasm-modules
          {
            echo "### Размеры WASM-модулей (emsdk $EMSDK_VERSION, OCCT $OCCT_VERSION, -Oz)"
            echo
            echo "| Модуль | Файл | байт | gzip -9, байт |"
            echo "|---|---|---:|---:|"
            for m in kernel modeling assembly drawing; do
              for ext in wasm mjs; do
                f="$b/wasm_$m/bendcore_$m.$ext"
                printf '| `%s` | `%s` | %d | %d |\n' "bendcore_${m}_wasm" "$(basename "$f")" \
                  "$(stat -c %s "$f")" "$(gzip -9 -c "$f" | wc -c)"
              done
            done
            probe=third_party/occt-build-wasm/probe/sizes.txt
            if [ -f "$probe" ]; then
              echo
              echo "Пробная программа OCCT (third_party/build_occt_wasm.sh):"
              echo
              echo '```'
              cat "$probe"
              echo '```'
            fi
          } | tee "$b/sizes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Модули и размеры
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm-modules
          path: |
            build-wasm-modules/wasm_kernel/
            build-wasm-modules/wasm_modeling/
            build-wasm-modules/wasm_assembly/
            build-wasm-modules/wasm_drawing/
            build-wasm-modules/sizes.md
          if-no-files-found: error

      - name: Журналы (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-modules-logs
          path: |
            occt-wasm-build.log
            build-wasm-modules.log
            third_party/occt-build-wasm/logs/
            third_party/occt-build-wasm/probe/
            build-wasm-modules/Testing/Temporary/
          if-no-files-found: ignore

  # Сквозные тесты Playwright + Chromium на модулях из wasm-modules: по набору на модуль и набор
  # оболочки приложения (test:e2e:app, все четыре модуля). Каталоги модулей передаются через
  # BENDCORE_<МОДУЛЬ>_WASM_DIR (web/<страница>/webpack.config.js, web/app/webpack.config.js).
  wasm-e2e:
    name: Playwright ${{ matrix.suite }}
    needs: wasm-modules
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: kernel
            module: wasm_kernel
            dir_env: BENDCORE_KERNEL_WASM_DIR
            results: kernel-viewer
          - suite: modeling
            module: wasm_modeling
            dir_env: BENDCORE_MODELING_WASM_DIR
            results: part-modeler
          - suite: assembly
            module: wasm_assembly
            dir_env: BENDCORE_ASSEMBLY_WASM_DIR
            results: assembly
          - suite: drawing
            module: wasm_drawing
            dir_env: BENDCORE_DRAWING_WASM_DIR
            results: drawing
          # Оболочка приложения (docs/ui/APP_SHELL.md) загружает все четыре модуля.
          - suite: app
            module: all
            dir_env: all
            results: app
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Модули из wasm-modules
        uses: actions/download-artifact@v4
        with:
          name: bendcore-wasm-modules
          path: wasm-artifact

      # postinstall-скрипты (electron и т. п.) тестам не нужны (docs/ui/KERNEL_VIEWPORT.md).
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: npm run test:e2e:${{ matrix.suite }}
        shell: bash
        env:
          CI: 'true'
        run: |
          a="$GITHUB_WORKSPACE/wasm-artifact"
          if [ "${{ matrix.module }}" = all ]; then
            for m in kernel modeling assembly drawing; do
              test -s "$a/wasm_$m/bendcore_$m.wasm"
              export "BENDCORE_${m^^}_WASM_DIR=$a/wasm_$m"
            done
          else
            test -s "$a/${{ matrix.module }}/bendcore_${{ matrix.suite }}.wasm"
            export ${{ matrix.dir_env }}="$a/${{ matrix.module }}"
          fi
          npm run test:e2e:${{ matrix.suite }} -- --trace off

      # Снимки экрана упавших шагов (screenshot: 'only-on-failure' в web/*/playwright.config.ts),
      # error-context.md Playwright и снимки, которые делают сами тесты.
      - name: Снимки и контекст ошибок (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.suite }}-results
          path: test-results/${{ matrix.results }}/
          if-no-files-found: warn
