name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja, Eigen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Версия совпадает с emsdk из архива, см. emscripten-version.txt. Проверить при первом запуске.
          version: '6.0.12'
          actions-cache-folder: emsdk-cache

      - name: Сборка и тесты WASM
        shell: bash
        env:
          BENDCORE_EIGEN_DIR: /usr/include/eigen3
        # Полный лог сохраняется в файл (для диагностики при падении), код возврата — от скрипта.
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh 2>&1 | tee build-wasm.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          # Блоб-хранилище логов может быть недоступно; строки ошибок выводим аннотациями (читаются через API).
          grep -n -i -E "error|fatal|failed|undefined reference|not found" build-wasm.log 2>/dev/null \
            | grep -v -i "warning" | head -n 15 \
            | while IFS= read -r line; do echo "::error title=build-wasm::${line:0:900}"; done
          for f in playwright-install.log page-check.log; do
            [ -f "$f" ] && tail -n 15 "$f" | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done
          echo "--- хвост лога ---"
          tail -n 30 build-wasm.log 2>/dev/null | while IFS= read -r line; do echo "::error title=tail::${line:0:900}"; done || true

      - name: Логи сборки (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm-logs
          path: |
            build-wasm.log
            build-wasm/CMakeFiles/CMakeOutput.log
            build-wasm/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Установка Playwright и Chromium
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/wasm-check && cd /tmp/wasm-check && npm init -y >/dev/null
          { npm install --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium; } 2>&1 | tee "$GITHUB_WORKSPACE/playwright-install.log"

      - name: Проверка страницы web/index.html в браузере
        shell: bash
        run: |
          set -o pipefail
          cp scripts/check_wasm_page.mjs /tmp/wasm-check/
          node /tmp/wasm-check/check_wasm_page.mjs "$GITHUB_WORKSPACE/build-wasm/web" 2>&1 | tee page-check.log

      - name: Выходные файлы
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm
          path: build-wasm/web/
          if-no-files-found: error

  # Ядро CAD для браузера (docs/ui/KERNEL_VIEWPORT.md): OCCT 8.0.1 для WASM
  # (third_party/build_occt_wasm.sh, docs/kernel/OCCT_BUILD.md, раздел 3), модуль
  # bendcore_kernel_wasm (cmake/wasm_kernel.cmake) и его проверка по корпусу в node.
  # Native-сборка с OCCT — job occt-native в qa.yml.
  kernel-wasm:
    name: Ядро WASM (OCCT 8.0.1, bendcore_kernel_wasm, корпус)
    runs-on: ubuntu-24.04
    # Сборка OCCT для WASM без кэша — около 25 минут на 4 ядрах (OCCT_BUILD.md, раздел 4).
    timeout-minutes: 120
    env:
      OCCT_VERSION: 8.0.1
      EMSDK_VERSION: 6.0.12
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-kernel

      # Ключ: версии OCCT и emsdk, список тулкитов и скрипт сборки. Кэшируются установка и
      # результаты пробной программы (sizes.txt, вывод под node), объектные файлы — нет.
      - name: Кэш OCCT для WASM
        id: occt-wasm-cache
        uses: actions/cache@v4
        with:
          path: |
            third_party/occt-install-wasm
            third_party/occt-build-wasm/probe
          key: occt-wasm-V${{ env.OCCT_VERSION }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('third_party/occt_toolkits.txt', 'third_party/build_occt_wasm.sh') }}

      # Тот же источник, что в build_occt.sh. Успех скрипта — код 0: внутри он собирает пробную
      # программу tests/kernel/wasm/occt_size_probe.cpp и проверяет её вывод OK под node.
      - name: Сборка OCCT для WASM
        if: steps.occt-wasm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch "V${OCCT_VERSION}" https://github.com/Open-Cascade-SAS/OCCT.git \
            "third_party/occt-${OCCT_VERSION}"
          OCCT_SOURCE="$GITHUB_WORKSPACE/third_party/occt-${OCCT_VERSION}" \
            third_party/build_occt_wasm.sh 2>&1 | tee occt-wasm-build.log

      - name: Конфигурация bendcore (Emscripten, BENDCORE_WITH_OCCT=ON)
        run: |
          emcmake cmake -S . -B build-wasm-kernel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBENDCORE_WITH_OCCT=ON -DBENDCORE_OCCT_DIR="$GITHUB_WORKSPACE/third_party/occt-install-wasm"

      - name: Сборка bendcore_kernel_wasm
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-wasm-kernel --target bendcore_kernel_wasm --parallel 2>&1 | tee build-wasm-kernel.log

      - name: Тест wasm_kernel_corpus (node)
        run: ctest --test-dir build-wasm-kernel -R '^wasm_kernel_corpus$' --no-tests=error --output-on-failure

      - name: Размеры модуля
        shell: bash
        run: |
          set -euo pipefail
          d=build-wasm-kernel/wasm_kernel
          {
            echo "### Размеры bendcore_kernel_wasm (emsdk $EMSDK_VERSION, OCCT $OCCT_VERSION)"
            echo
            echo "| Файл | байт | gzip -9, байт |"
            echo "|---|---:|---:|"
            for f in bendcore_kernel.wasm bendcore_kernel.mjs bendcore_kernel_api.mjs; do
              printf '| `%s` | %d | %d |\n' "$f" "$(stat -c %s "$d/$f")" "$(gzip -9 -c "$d/$f" | wc -c)"
            done
            probe=third_party/occt-build-wasm/probe/sizes.txt
            if [ -f "$probe" ]; then
              echo
              echo "Пробная программа OCCT (third_party/build_occt_wasm.sh):"
              echo
              echo '```'
              cat "$probe"
              echo '```'
            fi
          } | tee "$d/sizes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Модуль ядра и размеры
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-kernel-wasm
          path: |
            build-wasm-kernel/wasm_kernel/
            third_party/occt-build-wasm/probe/sizes.txt
          if-no-files-found: error

      - name: Журналы (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-wasm-logs
          path: |
            occt-wasm-build.log
            build-wasm-kernel.log
            third_party/occt-build-wasm/logs/
            third_party/occt-build-wasm/probe/
            build-wasm-kernel/Testing/Temporary/
          if-no-files-found: ignore

  # Сквозной тест вьюпорта ядра (tests/e2e-kernel, Playwright + Chromium) на модуле из kernel-wasm.
  kernel-viewer-e2e:
    name: Вьюпорт ядра (Playwright, Chromium)
    needs: kernel-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Модуль ядра из kernel-wasm
        uses: actions/download-artifact@v4
        with:
          name: bendcore-kernel-wasm
          path: kernel-artifact

      # postinstall-скрипты (electron и т. п.) тесту не нужны (docs/ui/KERNEL_VIEWPORT.md).
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Сквозной тест вьюпорта
        env:
          CI: 'true'
          BENDCORE_KERNEL_WASM_DIR: ${{ github.workspace }}/kernel-artifact/build-wasm-kernel/wasm_kernel
        run: npm run test:e2e:kernel -- --trace off

      - name: Снимки и контекст ошибок (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-viewer-e2e-results
          path: test-results/kernel-viewer/
          if-no-files-found: warn
