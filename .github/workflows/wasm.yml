name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja, Eigen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Версия совпадает с emsdk из архива, см. emscripten-version.txt. Проверить при первом запуске.
          version: '6.0.12'
          actions-cache-folder: emsdk-cache

      - name: Сборка и тесты WASM
        shell: bash
        env:
          BENDCORE_EIGEN_DIR: /usr/include/eigen3
        # Полный лог сохраняется в файл (для диагностики при падении), код возврата — от скрипта.
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh 2>&1 | tee build-wasm.log

      - name: Логи сборки (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm-logs
          path: |
            build-wasm.log
            build-wasm/CMakeFiles/CMakeOutput.log
            build-wasm/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Выходные файлы
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm
          path: build-wasm/web/
          if-no-files-found: error
