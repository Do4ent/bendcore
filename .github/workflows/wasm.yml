name: WebAssembly

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja, Eigen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Установка emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          # Версия совпадает с emsdk из архива, см. emscripten-version.txt. Проверить при первом запуске.
          version: '6.0.12'
          actions-cache-folder: emsdk-cache

      - name: Сборка и тесты WASM
        shell: bash
        env:
          BENDCORE_EIGEN_DIR: /usr/include/eigen3
        # Полный лог сохраняется в файл (для диагностики при падении), код возврата — от скрипта.
        run: |
          set -o pipefail
          ./scripts/build_wasm.sh 2>&1 | tee build-wasm.log

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          # Блоб-хранилище логов может быть недоступно; строки ошибок выводим аннотациями (читаются через API).
          grep -n -i -E "error|fatal|failed|undefined reference|not found" build-wasm.log 2>/dev/null \
            | grep -v -i "warning" | head -n 15 \
            | while IFS= read -r line; do echo "::error title=build-wasm::${line:0:900}"; done
          for f in playwright-install.log page-check.log; do
            [ -f "$f" ] && tail -n 15 "$f" | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done
          echo "--- хвост лога ---"
          tail -n 30 build-wasm.log 2>/dev/null | while IFS= read -r line; do echo "::error title=tail::${line:0:900}"; done || true

      - name: Логи сборки (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm-logs
          path: |
            build-wasm.log
            build-wasm/CMakeFiles/CMakeOutput.log
            build-wasm/CMakeFiles/CMakeError.log
          if-no-files-found: warn

      - name: Установка Playwright и Chromium
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/wasm-check && cd /tmp/wasm-check && npm init -y >/dev/null
          { npm install --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium; } 2>&1 | tee "$GITHUB_WORKSPACE/playwright-install.log"

      - name: Проверка страницы web/index.html в браузере
        shell: bash
        run: |
          set -o pipefail
          cp scripts/check_wasm_page.mjs /tmp/wasm-check/
          node /tmp/wasm-check/check_wasm_page.mjs "$GITHUB_WORKSPACE/build-wasm/web" 2>&1 | tee page-check.log

      - name: Выходные файлы
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-wasm
          path: build-wasm/web/
          if-no-files-found: error



  # Тело трубы на Open CASCADE (тесты test_tube_occt и остальные). Сборка OCCT кэшируется отдельно от установки.
  occt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (Ninja, Eigen)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Кэш сборки OCCT V8.0.1
        id: occt-build-cache
        uses: actions/cache@v4
        with:
          path: ~/occt-build
          key: occt-build-V8.0.1-ubuntu-24.04-v1

      - name: Исходники OCCT V8.0.1
        shell: bash
        run: |
          [ -d ~/occt-src ] || git clone --depth 1 --branch V8.0.1 https://github.com/Open-Cascade-SAS/OCCT.git ~/occt-src

      - name: Сборка OCCT V8.0.1 (статически, минимальный набор модулей)
        if: steps.occt-build-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          {
            cmake -S ~/occt-src -B ~/occt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$HOME/occt-install" \
              -DBUILD_LIBRARY_TYPE=Static -DBUILD_MODULE_Visualization=OFF \
              -DBUILD_MODULE_ApplicationFramework=OFF -DBUILD_MODULE_DataExchange=OFF -DBUILD_MODULE_Draw=OFF \
              -DBUILD_SAMPLES=OFF -DUSE_TBB=OFF -DUSE_FREETYPE=OFF -DUSE_FREEIMAGE=OFF -DUSE_RAPIDJSON=OFF \
              -DUSE_VTK=OFF -DUSE_OPENGL=OFF -DBUILD_Inspector=OFF
            cmake --build ~/occt-build --parallel
          } 2>&1 | tee "$GITHUB_WORKSPACE/occt-build.log"

      - name: Сохранить кэш сборки OCCT
        if: steps.occt-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/occt-build
          key: occt-build-V8.0.1-ubuntu-24.04-v1

      - name: Установка OCCT
        shell: bash
        run: |
          set -o pipefail
          {
            # Переконфигурация с префиксом установки: иначе заголовки ставятся в /usr/local (абсолютный путь в скрипте).
            cmake -S ~/occt-src -B ~/occt-build -DCMAKE_INSTALL_PREFIX="$HOME/occt-install"
            cmake --install ~/occt-build
            # Установка копирует не все заголовки: добираем недостающие из дерева сборки (как в README).
            cp -rn ~/occt-build/include/opencascade/. ~/occt-install/include/opencascade/
          } 2>&1 | tee "$GITHUB_WORKSPACE/occt-install.log"

      - name: Ошибки OCCT в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          for f in occt-build.log occt-install.log; do
            [ -f "$f" ] || continue
            grep -n -A6 -E "CMake Error|error:|FATAL" "$f" | head -n 30 | while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done

      - name: Сборка и тесты с Open CASCADE
        env:
          BENDCORE_EIGEN_DIR: /usr/include/eigen3
        run: |
          cmake -S . -B build-occt -G Ninja -DCMAKE_BUILD_TYPE=Release -DBENDCORE_WITH_OCCT=ON \
            -DBENDCORE_OCCT_DIR="$HOME/occt-install" -DBENDCORE_EIGEN_DIR="$BENDCORE_EIGEN_DIR"
          cmake --build build-occt --parallel
          ctest --test-dir build-occt --output-on-failure
