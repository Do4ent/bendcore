name: QA

# Проверка правила «никаких заглушек» (docs/PROJECT_PROCESS.md, раздел 2) и native-сборка
# с OCCT: все тесты build-occt, регрессия корпуса STEP, образ сервиса (docs/qa/QA.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  no-stubs:
    name: Проверка заглушек
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Режиму --diff нужен общий предок с базовой веткой.
          fetch-depth: 0

      - name: Самотест check_no_stubs
        run: bash tests/qa/test_check_no_stubs.sh

      - name: Каталоги нового кода и добавленные строки
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            args=(--diff "origin/$BASE_REF")
          elif [[ "$EVENT" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            args=(--diff "$BEFORE")
          else
            echo "Нет базы для --diff (новая ветка или ручной запуск): только полная проверка каталогов."
          fi
          set +e
          bash scripts/check_no_stubs.sh "${args[@]}" | tee no-stubs.txt
          rc=${PIPESTATUS[0]}
          set -e
          # Нарушения — аннотациями на строках изменений.
          sed -E -n 's/^([^:]+):([0-9]+): \[([a-z-]+)\] (.*)$/::error file=\1,line=\2,title=no-stubs \3::\4/p' no-stubs.txt | head -n 50
          exit "$rc"

  # Native-сборка с OCCT: все тесты build-occt (docs/kernel/OCCT_BUILD.md, раздел 4).
  # Единственная задача CI, собирающая native OCCT: бывший job "occt" из wasm.yml перенесён сюда
  # вместе с проверкой образа сервиса.
  occt-native:
    name: Native + OCCT 8.0.1 (все тесты build-occt, образ сервиса)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OCCT_VERSION: 8.0.1
    steps:
      - uses: actions/checkout@v4

      # Eigen — системный libeigen3-dev; без настоящего Eigen конфигурация падает
      # (см. docs/WASM_BUILD_GUIDE.md).
      # zlib и expat — для 3MF (bendcore_kernel_analysis): без них тест 3MF молча пропускается;
      # fonts-dejavu-core — системный шрифт нативных тестов чертежа (findSystemFont).
      - name: Зависимости (Ninja, GTest, Eigen, zlib, expat, DejaVu, Python3)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libeigen3-dev libexpat1-dev zlib1g-dev fonts-dejavu-core python3

      # Ключ зависит от версии OCCT, списка тулкитов и скрипта сборки: при изменении любого из
      # них OCCT пересобирается. Прежний ключ (occt-build-…-v3, 48 тулкитов) больше не совпадает.
      - name: Кэш установки OCCT
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: third_party/occt-install
          key: occt-native-V${{ env.OCCT_VERSION }}-ubuntu-24.04-${{ hashFiles('third_party/occt_toolkits.txt', 'third_party/build_occt.sh') }}

      - name: Сборка OCCT из исходников (тулкиты из third_party/occt_toolkits.txt)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          third_party/build_occt.sh 2>&1 | tee occt-build.log

      - name: Состав установки OCCT
        shell: bash
        env:
          CACHE_HIT: ${{ steps.occt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          listed=$(grep -c -E '^TK' third_party/occt_toolkits.txt)
          installed=$(ls third_party/occt-install/lib/libTK*.a | wc -l)
          echo "Тулкитов в списке: $listed, установлено: $installed"
          echo "OCCT $OCCT_VERSION (native): тулкитов в списке $listed, установлено $installed, кэш: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"

      - name: Конфигурация (BENDCORE_WITH_OCCT=ON)
        run: |
          cmake -S . -B build-occt -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBENDCORE_WITH_OCCT=ON -DBENDCORE_OCCT_DIR="$GITHUB_WORKSPACE/third_party/occt-install"

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-occt --parallel 2>&1 | tee build-occt.log

      # Все тесты build-occt, кроме замеров времени: performance и offset_performance (их пороги не
      # выдерживают параллельной нагрузки ctest, docs/kernel/OCCT_BUILD.md, раздел 2) и нагрузочных
      # stress_* (docs/qa/PERFORMANCE.md) — они идут следующим шагом последовательно.
      - name: Тесты build-occt (параллельно, без замеров времени)
        run: |
          ctest --test-dir build-occt --output-on-failure --timeout 1800 --parallel 4 --no-tests=error \
            -E '^(performance|offset_performance|stress_.*)$'

      # Выполняется и после падения предыдущего шага. Крупный STEP (≥ 50 МБ) строит
      # stress_step_generate (fixture ctest) в build-occt/stress-large; в git его нет.
      - name: Замеры времени и нагрузка (последовательно)
        if: success() || failure()
        env:
          # Запас по времени для машины CI относительно базовой линии docs/qa/PERFORMANCE.md.
          BENDCORE_STRESS_TIME_SCALE: '1.5'
        run: |
          ctest --test-dir build-occt --output-on-failure --timeout 1800 --no-tests=error \
            -R '^(performance|offset_performance|stress_.*)$'

      - name: Отчёт нагрузочных тестов в сводку
        if: success() || failure()
        shell: bash
        run: |
          f=build-occt/stress-report.jsonl
          [ -f "$f" ] || exit 0
          {
            echo "### Нагрузочные тесты (docs/qa/PERFORMANCE.md)"
            echo
            echo "| Время (UTC) | Тест | Шаг | с | порог, с | пик RSS, МиБ |"
            echo "|---|---|---|---:|---:|---:|"
            python3 -c 'import json,sys
          for l in open(sys.argv[1]):
              r=json.loads(l); print("| %s | %s | %s | %.3f | %.1f | %.0f |" % (r["time"], r["test"], r["step"], r["seconds"], r["limit_seconds"], r["peak_rss_mib"]))' "$f"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Отчёт нагрузочных тестов (артефакт)
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report
          path: build-occt/stress-report.jsonl
          if-no-files-found: warn

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          for f in occt-build.log build-occt.log; do
            [ -f "$f" ] || continue
            grep -n -E "ERROR|error:|FAILED|undefined reference" "$f" | head -n 20 | \
              while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done

      - name: Журналы (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: occt-native-logs
          path: |
            occt-build.log
            build-occt.log
            third_party/occt-build/logs/
            build-occt/Testing/Temporary/
            build-occt/fuzz-artifacts/
          if-no-files-found: ignore

      - name: Свежесгенерированный корпус (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-corpus-fresh
          path: build-occt/corpus-fresh/
          if-no-files-found: warn

      # Образ сервиса тела трубы и проверка запросов к контейнеру (та же установка OCCT).
      - name: Сборка образа сервиса
        shell: bash
        run: |
          set -o pipefail
          docker build --build-context occt="$GITHUB_WORKSPACE/third_party/occt-install" -f docker/Dockerfile -t bendcore-server:ci . \
            2>&1 | tee docker-build.log

      - name: Проверка сервиса в контейнере
        shell: bash
        run: |
          set -o pipefail
          docker run -d --name bendcore-server -p 8080:8080 bendcore-server:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/v1/health | grep -q '"ok":true'
          curl -sf -X POST --data-binary @examples/tube_path.json \
            "http://127.0.0.1:8080/v1/tube?format=json&od=16&wall=0&deflection=0.05" -o tube.json
          grep -q '"ok":true' tube.json
          grep -q '"valid":true' tube.json
          code=$(curl -s -o err.json -w "%{http_code}" -X POST --data-binary $'kind,length\nstraight,abc' \
            "http://127.0.0.1:8080/v1/tube?format=csv&od=16")
          [ "$code" = "400" ]
          grep -q '"ok":false' err.json

      - name: Логи контейнера сервиса
        if: always()
        shell: bash
        run: |
          docker logs bendcore-server 2>&1 | tail -n 50 || true
          docker rm -f bendcore-server >/dev/null 2>&1 || true

  # Fuzz-проверка загрузчиков (docs/qa/QA.md, раздел 7) в отдельной конфигурации clang +
  # ASan/UBSan: детерминированный мутационный тест (fuzz_loaders, список known_defects.txt для
  # конфигурации asan), прогон фаззеров libFuzzer по затравочному корпусу и короткий поиск.
  # OCCT берётся из кэша occt-native (тот же ключ; job ждёт его сохранения) и не
  # инструментирован: санитайзеры проверяют код bendcore и границы вызовов OCCT.
  fuzz:
    name: Fuzz загрузчиков (clang, ASan/UBSan, libFuzzer)
    needs: occt-native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OCCT_VERSION: 8.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости (clang 18, libFuzzer, Ninja, GTest, Eigen, zlib, expat, DejaVu)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev ninja-build libgtest-dev libeigen3-dev \
            libexpat1-dev zlib1g-dev fonts-dejavu-core

      - name: Кэш установки OCCT (из occt-native)
        uses: actions/cache/restore@v4
        with:
          path: third_party/occt-install
          key: occt-native-V${{ env.OCCT_VERSION }}-ubuntu-24.04-${{ hashFiles('third_party/occt_toolkits.txt', 'third_party/build_occt.sh') }}
          fail-on-cache-miss: true

      - name: Конфигурация build-fuzz (BENDCORE_FUZZ=ON, ASan/UBSan)
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBENDCORE_WITH_OCCT=ON -DBENDCORE_OCCT_DIR="$GITHUB_WORKSPACE/third_party/occt-install" \
            -DBENDCORE_FUZZ=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,fuzzer-no-link -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Сборка фаззеров и теста
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-fuzz --parallel --target test_fuzz_loaders fuzz_seeds fuzz_replay \
            fuzz_part_json fuzz_assembly_json fuzz_drawing_json fuzz_step fuzz_dxf fuzz_brep_binary fuzz_brep_text \
            2>&1 | tee build-fuzz.log

      - name: Мутационный тест и корпус фаззеров (ctest -L fuzz)
        run: ctest --test-dir build-fuzz -L fuzz --output-on-failure --no-tests=error --parallel 2

      # Поиск по 60 с на цель. Цели, у которых чтение идёт через читатели OCCT (STEP, BRep и BRep,
      # встроенный в документ сборки), падают в самом OCCT (known_defects.txt) — их находки
      # сохраняются в артефакт, но шаг не роняют; для остальных любая находка — ошибка.
      - name: libFuzzer, 60 с на цель
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=0:malloc_limit_mb=4096
        run: |
          set -u
          mkdir -p fuzz-findings
          rc=0
          for t in part_json drawing_json dxf assembly_json step brep_binary brep_text; do
            mkdir -p "fuzz-work/$t"
            set +e
            build-fuzz/fuzz_$t "fuzz-work/$t" "build-fuzz/fuzz-corpus/$t" -max_total_time=60 -timeout=30 \
              -rss_limit_mb=4096 -artifact_prefix="fuzz-findings/$t-" -print_final_stats=1 > "fuzz-findings/$t.log" 2>&1
            r=$?
            set -e
            echo "fuzz_$t: exit $r ($(grep -c '^#' "fuzz-findings/$t.log") status lines)"
            case "$t" in
              part_json|drawing_json|dxf) [ "$r" -eq 0 ] || { echo "::error title=fuzz_$t::libFuzzer finding, see artifact fuzz-findings"; rc=1; } ;;
              *) [ "$r" -eq 0 ] || echo "::warning title=fuzz_$t::finding inside OCCT readers (known_defects.txt)" ;;
            esac
          done
          exit $rc

      - name: Находки фаззеров и журналы (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            fuzz-findings/
            build-fuzz/fuzz-artifacts/
            build-fuzz/Testing/Temporary/
            build-fuzz.log
          if-no-files-found: ignore
