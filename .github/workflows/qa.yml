name: QA

# Проверка правила «никаких заглушек» (docs/PROJECT_PROCESS.md, раздел 2) и native-сборка
# с OCCT: все тесты build-occt, регрессия корпуса STEP, образ сервиса (docs/qa/QA.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  no-stubs:
    name: Проверка заглушек
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Режиму --diff нужен общий предок с базовой веткой.
          fetch-depth: 0

      - name: Самотест check_no_stubs
        run: bash tests/qa/test_check_no_stubs.sh

      - name: Каталоги нового кода и добавленные строки
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$EVENT" == "pull_request" ]]; then
            git fetch --no-tags origin "$BASE_REF"
            args=(--diff "origin/$BASE_REF")
          elif [[ "$EVENT" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            args=(--diff "$BEFORE")
          else
            echo "Нет базы для --diff (новая ветка или ручной запуск): только полная проверка каталогов."
          fi
          set +e
          bash scripts/check_no_stubs.sh "${args[@]}" | tee no-stubs.txt
          rc=${PIPESTATUS[0]}
          set -e
          # Нарушения — аннотациями на строках изменений.
          sed -E -n 's/^([^:]+):([0-9]+): \[([a-z-]+)\] (.*)$/::error file=\1,line=\2,title=no-stubs \3::\4/p' no-stubs.txt | head -n 50
          exit "$rc"

  # Native-сборка с OCCT: все тесты build-occt (docs/kernel/OCCT_BUILD.md, раздел 4).
  # Единственная задача CI, собирающая native OCCT: бывший job "occt" из wasm.yml перенесён сюда
  # вместе с проверкой образа сервиса.
  occt-native:
    name: Native + OCCT 8.0.1 (все тесты build-occt, образ сервиса)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OCCT_VERSION: 8.0.1
    steps:
      - uses: actions/checkout@v4

      # Каталог Eigen не задаётся: корневой CMakeLists.txt находит его сам
      # (third_party/eigen-5.0.0); libeigen3-dev — запасной системный вариант.
      - name: Зависимости (Ninja, GTest, Eigen, Python3)
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libeigen3-dev python3

      # Ключ зависит от версии OCCT, списка тулкитов и скрипта сборки: при изменении любого из
      # них OCCT пересобирается. Прежний ключ (occt-build-…-v3, 48 тулкитов) больше не совпадает.
      - name: Кэш установки OCCT
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: third_party/occt-install
          key: occt-native-V${{ env.OCCT_VERSION }}-ubuntu-24.04-${{ hashFiles('third_party/occt_toolkits.txt', 'third_party/build_occt.sh') }}

      - name: Сборка OCCT из исходников (тулкиты из third_party/occt_toolkits.txt)
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          third_party/build_occt.sh 2>&1 | tee occt-build.log

      - name: Состав установки OCCT
        shell: bash
        env:
          CACHE_HIT: ${{ steps.occt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          listed=$(grep -c -E '^TK' third_party/occt_toolkits.txt)
          installed=$(ls third_party/occt-install/lib/libTK*.a | wc -l)
          echo "Тулкитов в списке: $listed, установлено: $installed"
          echo "OCCT $OCCT_VERSION (native): тулкитов в списке $listed, установлено $installed, кэш: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"

      - name: Конфигурация (BENDCORE_WITH_OCCT=ON)
        run: |
          cmake -S . -B build-occt -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBENDCORE_WITH_OCCT=ON -DBENDCORE_OCCT_DIR="$GITHUB_WORKSPACE/third_party/occt-install"

      - name: Сборка
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-occt --parallel 2>&1 | tee build-occt.log

      # Все тесты build-occt, кроме "performance": его пороги времени не выдерживают параллельной
      # нагрузки ctest (docs/kernel/OCCT_BUILD.md, раздел 2), поэтому он идёт следующим шагом один.
      - name: Тесты build-occt (параллельно, без performance)
        run: ctest --test-dir build-occt --output-on-failure --timeout 600 --parallel 4 --no-tests=error -E '^performance$'

      - name: Тест performance (последовательно)
        if: success() || failure()
        run: ctest --test-dir build-occt --output-on-failure --timeout 600 --no-tests=error -R '^performance$'

      - name: Ошибки в аннотации (только при падении)
        if: failure()
        shell: bash
        run: |
          for f in occt-build.log build-occt.log; do
            [ -f "$f" ] || continue
            grep -n -E "ERROR|error:|FAILED|undefined reference" "$f" | head -n 20 | \
              while IFS= read -r line; do echo "::error title=$f::${line:0:900}"; done
          done

      - name: Журналы (только при падении)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: occt-native-logs
          path: |
            occt-build.log
            build-occt.log
            third_party/occt-build/logs/
            build-occt/Testing/Temporary/
          if-no-files-found: ignore

      - name: Свежесгенерированный корпус (при любом результате)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bendcore-corpus-fresh
          path: build-occt/corpus-fresh/
          if-no-files-found: warn

      # Образ сервиса тела трубы и проверка запросов к контейнеру (та же установка OCCT).
      - name: Сборка образа сервиса
        shell: bash
        run: |
          set -o pipefail
          docker build --build-context occt="$GITHUB_WORKSPACE/third_party/occt-install" -f docker/Dockerfile -t bendcore-server:ci . \
            2>&1 | tee docker-build.log

      - name: Проверка сервиса в контейнере
        shell: bash
        run: |
          set -o pipefail
          docker run -d --name bendcore-server -p 8080:8080 bendcore-server:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/v1/health | grep -q '"ok":true'
          curl -sf -X POST --data-binary @examples/tube_path.json \
            "http://127.0.0.1:8080/v1/tube?format=json&od=16&wall=0&deflection=0.05" -o tube.json
          grep -q '"ok":true' tube.json
          grep -q '"valid":true' tube.json
          code=$(curl -s -o err.json -w "%{http_code}" -X POST --data-binary $'kind,length\nstraight,abc' \
            "http://127.0.0.1:8080/v1/tube?format=csv&od=16")
          [ "$code" = "400" ]
          grep -q '"ok":false' err.json

      - name: Логи контейнера сервиса
        if: always()
        shell: bash
        run: |
          docker logs bendcore-server 2>&1 | tail -n 50 || true
          docker rm -f bendcore-server >/dev/null 2>&1 || true
